# Configuration file

####################
# compat
####################

compat {
    # Support for custom logs block that aren't instances of `BlockLog`. Enable inspect_mode and right click with a stick to get more info in the log. Used by TreeCapitator-providers (gravisuite, harvester).
    # Default: [thaumcraft.common.world.BlockMagicalLog]
    S:logs <
        thaumcraft.common.world.BlockMagicalLog
     >

    # Max Block per both Vein Mining and Tree Chopping Actions.
    # Min: 1, Max: 2147483647, Default: 256
    I:veinMaxCount=256
}


####################
# general
####################

general {
    # Enable inspect mode. Helps identify block name, class and metadata.
    # Default: false
    B:enable_inspect_mode=false

    # Supported localizations. Place your <name>.json file in config/VintageCore/lang folder or inside mods/VintageCore/lang inside modJar
    # Default: [en_US, ru_RU]
    S:localizations <
        en_US
        ru_RU
     >
}


